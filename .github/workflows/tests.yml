name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Generate a throwaway Fernet key for the test run
        run: echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          JWT_SECRET_KEY: ci_dummy_jwt_secret
          SESSION_SECRET_KEY: ci_dummy_session_secret
          GEMINI_API_KEY: ci_dummy_gemini_key
        # `-m pytest` (not bare `pytest`) so the repo root is on sys.path --
        # the app modules (auth, security, scanner, ...) live there, not in
        # a package, and there's no conftest.py at the root adding it.
        run: python -m pytest -q
