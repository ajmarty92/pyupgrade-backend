# Fly.io app configuration.
#
# App name must be globally unique across all of Fly.io -- if "pyupgrade-backend"
# is taken, change `app` below (or pass --name to `fly launch`/`fly apps create`).
app = "pyupgrade-backend"
primary_region = "iad"

[build]

[env]
  PRODUCTION = "true"

# Two process groups sharing the same image, mirroring the old Heroku Procfile:
# "web" serves the API, "worker" runs the Celery consumer for repo scans.
[processes]
  web = "uvicorn main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*'"
  worker = "celery -A celery_worker.celery_app worker --loglevel=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
